name: Deploy simulator to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "simulator/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Stamp script and stylesheet URLs with the commit, so browsers never mix
      # cached files from an older deploy with new ones.
      - name: Cache-bust asset URLs
        run: |
          sed -i -E "s/(src|href)=\"([^\":]+\.(js|css))\"/\1=\"\2?v=${GITHUB_SHA::7}\"/g" simulator/index.html
          grep -E '\?v=' simulator/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: simulator
      - id: deployment
        uses: actions/deploy-pages@v4

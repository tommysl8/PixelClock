; PixelClock firmware for the Adafruit Matrix Portal S3 + 64x64 HUB75 panel.
;
;   pio run                 build
;   pio run -t upload       build and flash over USB-C
;   pio device monitor      serial log

[platformio]
default_envs = matrixportal

[env:matrixportal]
platform = espressif32
board = adafruit_matrixportal_esp32s3
framework = arduino
monitor_speed = 115200
build_unflags =
  -std=gnu++11
  -Os
build_flags =
  -std=gnu++17
  -O2
  -DPIXELCLOCK_FLOAT
lib_deps =
  adafruit/Adafruit Protomatter@^1.7.1
  adafruit/Adafruit LIS3DH@^1.3.0
  tzapu/WiFiManager@^2.0.17
